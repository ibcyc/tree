<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Tree</title>
<style>
  :root {
    --bg: #191919;
    --fg: #f4f4f4;
    --cols: 72;
    --rows: 32;
    --fs: min(16px, calc((100vw - 32px) / var(--cols) / 0.6), calc((100vh - 48px) / var(--rows) / 1.15));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, "Courier New", monospace;
  }
  #stage { position: relative; }
  #tree {
    font: inherit;
    font-size: var(--fs);
    line-height: 1.15;
    white-space: pre;
    user-select: none;
    cursor: pointer;
  }
  .leaf {
    position: absolute;
    left: 0;
    top: 0;
    font-size: var(--fs);
    line-height: 1.15;
    pointer-events: none;
    will-change: transform, opacity;
  }
</style>
</head>
<body>
<div id="stage"><pre id="tree" aria-label="ASCII tree"></pre></div>

<script>
(() => {
  const W = 72, H = 32, CX = 36;
  const GROUND = 30;                       // ground line row
  const GROUND_X0 = 8, GROUND_X1 = 63;

  // ── colours ──
  const GREENS  = ['#3f8a44', '#4f9a4a', '#5fae55', '#6fbf5e', '#86c86c', '#4a7f3c'];
  const YELLOWS = ['#b9cf52', '#d2d35a', '#e2c75a'];
  const WOOD = '#9a7a5a', WOOD_DARK = '#7d6248', GRASS = '#5f7a4c', DIRT = '#6b6256';
  const LEAF_CH = '&&&%%@@*#o';
  const leafColor = (r = Math.random) => r() < 0.14 ? pick(YELLOWS, r) : pick(GREENS, r);

  // fixed seed → the same tree on every load (change it for a different tree)
  let seed = 1116;
  const srnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const rnd = Math.random;
  function pick(a, r = rnd) { return a[(r() * a.length) | 0]; }

  const ch   = Array.from({ length: H }, () => Array(W).fill(' '));
  const col  = Array.from({ length: H }, () => Array(W).fill(''));
  const kind = Array.from({ length: H }, () => Array(W).fill(0)); // 0 empty, 1 leaf, 2 wood/ground
  const set = (x, y, c, color, k) => {
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    ch[y][x] = c; col[y][x] = color; kind[y][x] = k;
  };
  const isEmpty = (x, y) => x >= 0 && x < W && y >= 0 && y < H && kind[y][x] === 0;

  // ── ground ──
  for (let x = GROUND_X0; x <= GROUND_X1; x++) {
    const r = srnd();
    set(x, GROUND, r < 0.12 ? ',' : r < 0.2 ? '.' : '_', GRASS, 2);
    if (srnd() < 0.07) set(x, GROUND - 1, srnd() < 0.5 ? "'" : ',', GRASS, 2);
    if (srnd() < 0.18) set(x, GROUND + 1, srnd() < 0.5 ? '.' : '`', DIRT, 2);
  }

  // ── trunk: gentle S-curve, tapering ──
  const T = 20;
  const trunk = [];                         // x of trunk centre at each height i
  const phase = srnd() * Math.PI;
  for (let i = 0; i <= T; i++) {
    trunk.push(CX + Math.round(Math.sin(i * 0.14 + phase) * 1.6 - Math.sin(phase) * 1.6));
  }
  for (let i = 0; i <= T; i++) {
    const y = GROUND - 1 - i, x = trunk[i];
    const dx = i ? x - trunk[i - 1] : 0;
    const c = dx > 0 ? '/' : dx < 0 ? '\\' : '|';
    const w = i < 6 ? 3 : i < 13 ? 2 : 1;
    const x0 = w === 1 ? x : x - 1;
    for (let k = 0; k < w; k++) set(x0 + k, y, c, k === 0 && w > 1 ? WOOD_DARK : WOOD, 2);
  }
  // roots
  set(trunk[0] - 2, GROUND - 1, '/', WOOD_DARK, 2);
  set(trunk[0] + 2, GROUND - 1, '\\', WOOD_DARK, 2);
  set(trunk[0] - 3, GROUND, '_', WOOD_DARK, 2);
  set(trunk[0] + 3, GROUND, '_', WOOD_DARK, 2);

  // ── branches: mostly sideways, climbing a row every few steps ──
  const branch = (i, dir, len, every) => {
    let x = trunk[i] + dir * (i < 13 ? 1 : 0), y = GROUND - 1 - i;
    for (let k = 1; k <= len; k++) {
      x += dir;
      if (k % every === 0) { y--; set(x, y, dir > 0 ? '/' : '\\', WOOD, 2); }
      else set(x, y, '_', WOOD, 2);
    }
    return [x, y];
  };

  // ── foliage pads: flat-bottomed clouds sitting on branch tips ──
  const SHAPE = [0.85, 1, 0.95, 0.75, 0.45];
  const pad = (cx, cy, pw, ph) => {
    for (let r = 0; r < ph; r++) {
      const w = Math.round(pw * SHAPE[r] + (srnd() - 0.5) * 2);
      for (let dc = -w; dc <= w; dc++) {
        if (Math.abs(dc) > w - 2 && srnd() < 0.35) continue;
        if (srnd() < 0.94 && isEmpty(cx + dc, cy - r)) set(cx + dc, cy - r, pick(LEAF_CH, srnd), leafColor(srnd), 1);
      }
    }
    for (let dc = -pw + 2; dc <= pw - 2; dc++)              // a few hanging below
      if (srnd() < 0.2 && isEmpty(cx + dc, cy + 1)) set(cx + dc, cy + 1, pick(LEAF_CH, srnd), leafColor(srnd), 1);
  };

  const tiers = [
    // trunk height, direction, length, climb every n steps, pad half-width, pad height
    [6, -1, 13, 4, 11, 4],
    [7,  1, 13, 4, 11, 4],
    [11, -1, 11, 3, 10, 4],
    [12,  1, 11, 3, 10, 4],
    [15, -1, 7, 3, 9, 4],
    [16,  1, 7, 2, 8, 4],
  ];
  const tips = tiers.map(([i, dir, len, every, pw, ph]) => [branch(i, dir, len, every), dir, pw, ph]);
  // crown first, then tiers top-down so upper pads sit in front
  pad(trunk[T], GROUND - 1 - T, 11, 5);
  for (let n = tips.length - 1; n >= 0; n--) {
    const [[x, y], dir, pw, ph] = tips[n];
    pad(x - dir * 3, y, pw, ph);
  }

  const leafCells = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (kind[y][x] === 1) leafCells.push([x, y]);

  // ── rendering ──
  const tree = document.getElementById('tree');
  const stage = document.getElementById('stage');
  const esc = c => c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c;
  let dirty = true;
  const render = () => {
    let out = '';
    for (let y = 0; y < H; y++) {
      let run = '', runCol = null;
      const flush = () => {
        if (!run) return;
        out += runCol ? `<span style="color:${runCol}">${run}</span>` : run;
        run = '';
      };
      for (let x = 0; x < W; x++) {
        const c = ch[y][x], cl = c === ' ' ? runCol : col[y][x];
        if (cl !== runCol) { flush(); runCol = cl; }
        run += esc(c);
      }
      flush();
      if (y < H - 1) out += '\n';
    }
    tree.innerHTML = out;
    dirty = false;
  };

  let cw = 10, chH = 18;
  const measure = () => {
    const r = tree.getBoundingClientRect();
    cw = r.width / W; chH = r.height / H;
  };

  // ── falling leaves ──
  const leaves = [];
  const dropLeaf = () => {
    for (let tries = 0; tries < 30; tries++) {
      const [x, y] = pick(leafCells);
      if (ch[y][x] === ' ') continue;
      // yellow leaves are the ones most likely to let go
      if (!YELLOWS.includes(col[y][x]) && rnd() < 0.55) continue;
      const c = ch[y][x], color = col[y][x];
      ch[y][x] = ' '; dirty = true;
      setTimeout(() => { ch[y][x] = pick(LEAF_CH); col[y][x] = leafColor(); dirty = true; }, 7000 + rnd() * 14000);

      const el = document.createElement('span');
      el.className = 'leaf';
      el.textContent = c;
      el.style.color = color;
      stage.appendChild(el);
      leaves.push({
        el, bx: x, x, y, t: 0,
        vy: 1.6 + rnd() * 1.6,          // rows / s
        amp: 0.6 + rnd() * 1.4,         // cols
        freq: 1 + rnd() * 1.6,
        phase: rnd() * Math.PI * 2,
        rot: rnd() * 360,
        vr: (rnd() - 0.5) * 260,
        state: 'fall', rest: 0, op: 1,
      });
      return;
    }
  };

  let wind = 0, windT = 0, spawnAcc = 0, nextSpawn = 0.5;
  let last = performance.now();

  const frame = (now) => {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    windT += dt;
    wind = Math.sin(windT * 0.23) * 0.5 + Math.sin(windT * 0.71) * 0.25;

    spawnAcc += dt;
    if (spawnAcc >= nextSpawn) { spawnAcc = 0; nextSpawn = 0.35 + rnd() * 1.1; dropLeaf(); }

    for (let i = leaves.length - 1; i >= 0; i--) {
      const L = leaves[i];
      L.t += dt;
      if (L.state === 'fall') {
        L.y += L.vy * dt;
        L.bx += wind * dt;
        L.x = L.bx + Math.sin(L.phase + L.t * L.freq) * L.amp;
        L.rot += L.vr * dt;
        const onGround = L.x >= GROUND_X0 && L.x <= GROUND_X1;
        if (onGround && L.y >= GROUND - 0.15) {
          L.y = GROUND - 0.15;
          L.rot = Math.round(L.rot / 180) * 180;
          L.state = 'rest';
          L.rest = 2.5 + rnd() * 4;
        } else if (L.y > H + 2) {
          L.op -= dt;
        }
      } else {
        L.rest -= dt;
        if (L.rest < 0) L.op -= dt * 0.5;
      }
      if (L.op <= 0) { L.el.remove(); leaves.splice(i, 1); continue; }
      L.el.style.opacity = L.op;
      L.el.style.transform = `translate(${L.x * cw}px, ${L.y * chH}px) rotate(${L.rot}deg)`;
    }

    if (dirty) render();
    requestAnimationFrame(frame);
  };

  // click the tree to shake loose a handful of leaves
  tree.addEventListener('click', () => { for (let i = 0; i < 14; i++) dropLeaf(); });

  render();
  measure();
  addEventListener('resize', measure);
  document.fonts && document.fonts.ready.then(measure);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
