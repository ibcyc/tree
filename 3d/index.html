<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Tree</title>
<style>
  :root { --bg: #191919; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas.dragging { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="c" aria-label="Rotating ASCII tree"></canvas>

<script>
(() => {
  // ════════════════════════════════════════════════════════════════
  //  1. The flat tree — identical to /2d (same seed, same steps), so
  //     the front view at rest is exactly the 2D picture.
  // ════════════════════════════════════════════════════════════════
  const W = 72, H = 32, CX = 36;
  const GROUND = 30;
  const GROUND_X0 = 8, GROUND_X1 = 63;

  const GREENS  = ['#3f8a44', '#4f9a4a', '#5fae55', '#6fbf5e', '#86c86c', '#4a7f3c'];
  const YELLOWS = ['#b9cf52', '#d2d35a', '#e2c75a'];
  const WOOD = '#9a7a5a', WOOD_DARK = '#7d6248', GRASS = '#5f7a4c', DIRT = '#6b6256';
  const LEAF_CH = '&&&%%@@*#o';
  const leafColor = (r = Math.random) => r() < 0.14 ? pick(YELLOWS, r) : pick(GREENS, r);

  let seed = 1116;
  const srnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const rnd = Math.random;
  function pick(a, r = rnd) { return a[(r() * a.length) | 0]; }

  const ch   = Array.from({ length: H }, () => Array(W).fill(' '));
  const col  = Array.from({ length: H }, () => Array(W).fill(''));
  const kind = Array.from({ length: H }, () => Array(W).fill(0));
  // extra bookkeeping for 3D (does not touch the random sequence)
  const tag  = Array.from({ length: H }, () => Array(W).fill(null));
  let curTag = null;
  const set = (x, y, c, color, k) => {
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    ch[y][x] = c; col[y][x] = color; kind[y][x] = k; tag[y][x] = curTag;
  };
  const isEmpty = (x, y) => x >= 0 && x < W && y >= 0 && y < H && kind[y][x] === 0;

  // ground
  for (let x = GROUND_X0; x <= GROUND_X1; x++) {
    const r = srnd();
    curTag = { t: 'ground' };
    set(x, GROUND, r < 0.12 ? ',' : r < 0.2 ? '.' : '_', GRASS, 2);
    curTag = { t: 'speck' };
    if (srnd() < 0.07) set(x, GROUND - 1, srnd() < 0.5 ? "'" : ',', GRASS, 2);
    if (srnd() < 0.18) set(x, GROUND + 1, srnd() < 0.5 ? '.' : '`', DIRT, 2);
  }

  // trunk
  const T = 20;
  const trunk = [];
  const phase = srnd() * Math.PI;
  for (let i = 0; i <= T; i++) {
    trunk.push(CX + Math.round(Math.sin(i * 0.14 + phase) * 1.6 - Math.sin(phase) * 1.6));
  }
  for (let i = 0; i <= T; i++) {
    const y = GROUND - 1 - i, x = trunk[i];
    const dx = i ? x - trunk[i - 1] : 0;
    const c = dx > 0 ? '/' : dx < 0 ? '\\' : '|';
    const w = i < 6 ? 3 : i < 13 ? 2 : 1;
    const x0 = w === 1 ? x : x - 1;
    curTag = { t: 'trunk', cx: x0 + (w - 1) / 2, r: w === 3 ? 1.7 : w === 2 ? 1.2 : 0.7 };
    for (let k = 0; k < w; k++) set(x0 + k, y, c, k === 0 && w > 1 ? WOOD_DARK : WOOD, 2);
  }
  curTag = { t: 'root' };
  set(trunk[0] - 2, GROUND - 1, '/', WOOD_DARK, 2);
  set(trunk[0] + 2, GROUND - 1, '\\', WOOD_DARK, 2);
  set(trunk[0] - 3, GROUND, '_', WOOD_DARK, 2);
  set(trunk[0] + 3, GROUND, '_', WOOD_DARK, 2);

  // branches
  const branches = [];
  const branch = (i, dir, len, every) => {
    const id = branches.length;
    let x = trunk[i] + dir * (i < 13 ? 1 : 0), y = GROUND - 1 - i;
    const b = { x0: x, y0: y };
    branches.push(b);
    for (let k = 1; k <= len; k++) {
      x += dir;
      curTag = { t: 'branch', id, f: k / len };
      if (k % every === 0) { y--; set(x, y, dir > 0 ? '/' : '\\', WOOD, 2); }
      else set(x, y, '_', WOOD, 2);
    }
    b.x1 = x; b.y1 = y;
    return [x, y];
  };

  // foliage pads
  const SHAPE = [0.85, 1, 0.95, 0.75, 0.45];
  const pads = [];
  const pad = (cx, cy, pw, ph, zc) => {
    const id = pads.length;
    pads.push({ cx, cy, pw, ph, zc });
    curTag = { t: 'leaf', id };
    for (let r = 0; r < ph; r++) {
      const w = Math.round(pw * SHAPE[r] + (srnd() - 0.5) * 2);
      for (let dc = -w; dc <= w; dc++) {
        if (Math.abs(dc) > w - 2 && srnd() < 0.35) continue;
        if (srnd() < 0.94 && isEmpty(cx + dc, cy - r)) set(cx + dc, cy - r, pick(LEAF_CH, srnd), leafColor(srnd), 1);
      }
    }
    for (let dc = -pw + 2; dc <= pw - 2; dc++)
      if (srnd() < 0.2 && isEmpty(cx + dc, cy + 1)) set(cx + dc, cy + 1, pick(LEAF_CH, srnd), leafColor(srnd), 1);
  };

  const tiers = [
    [6, -1, 13, 4, 11, 4],
    [7,  1, 13, 4, 11, 4],
    [11, -1, 11, 3, 10, 4],
    [12,  1, 11, 3, 10, 4],
    [15, -1, 7, 3, 9, 4],
    [16,  1, 7, 2, 8, 4],
  ];
  // how far each tier's pad sits in front of (−) or behind (+) the trunk — invisible from the front
  const TIER_Z = [-9, 8, 9, -8, -5, 6];
  const tips = tiers.map(([i, dir, len, every, pw, ph]) => [branch(i, dir, len, every), dir, pw, ph]);
  tiers.forEach((_, n) => { branches[n].z1 = TIER_Z[n]; });
  pad(trunk[T], GROUND - 1 - T, 11, 5, 0);
  for (let n = tips.length - 1; n >= 0; n--) {
    const [[x, y], dir, pw, ph] = tips[n];
    pad(x - dir * 3, y, pw, ph, TIER_Z[n]);
  }

  // ════════════════════════════════════════════════════════════════
  //  2. Give every character a depth: each cell becomes a column of
  //     points along z. The front-most point keeps the 2D character.
  // ════════════════════════════════════════════════════════════════
  let seed2 = 77;
  const r2 = () => (seed2 = (seed2 * 1664525 + 1013904223) >>> 0) / 4294967296;

  const COLORS = [...GREENS, ...YELLOWS, WOOD, WOOD_DARK, GRASS, DIRT];
  const cIdx = c => COLORS.indexOf(c);
  const FACT = [0.5, 0.6, 0.7, 0.8, 0.9, 1, 1.08, 1.16, 1.24];
  const REST_LV = 5;
  const PAL = COLORS.map(h => FACT.map(f => {
    const v = [1, 3, 5].map(i => Math.min(255, Math.round(parseInt(h.slice(i, i + 2), 16) * f)));
    return `rgb(${v.join(',')})`;
  }));

  const PXa = [], PRa = [], PZa = [], CHa = [], COa = [], BRa = [], CLa = [];
  let nCols = 0;
  const colFront = [];          // per column: index of its front point, for falling leaves
  const addCol = (x, y, z0, z1, step, frontCh, frontCo, fill) => {
    const cid = nCols++;
    colFront.push(PXa.length);
    for (let z = z0, first = true; z <= z1 + 1e-6; z += step, first = false) {
      const [c, co] = first ? [frontCh, frontCo] : fill();
      if (c === null) continue;
      PXa.push(x - CX); PRa.push(y); PZa.push(z); CHa.push(c); COa.push(cIdx(co));
      BRa.push(curBranch); CLa.push(cid);
    }
    return cid;
  };
  let curBranch = -1;
  const leafCols = [];
  const RG = 28;                                              // ground disc radius

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const tg = tag[y][x];
    if (!tg || ch[y][x] === ' ') continue;
    const c0 = ch[y][x], co0 = col[y][x];
    curBranch = -1;
    if (tg.t === 'leaf') {
      const p = pads[tg.id];
      const r = p.cy - y;
      const w = r >= 0 && r < p.ph ? p.pw * SHAPE[r] : p.pw * 0.55;
      const d = Math.sqrt(Math.max(0.6, w * w - (x - p.cx) * (x - p.cx)));
      const cid = addCol(x, y, p.zc - d, p.zc + d, 0.7, c0, co0, () => [pick(LEAF_CH, r2), leafColor(r2)]);
      leafCols.push({ cid, yellow: YELLOWS.includes(co0) });
    } else if (tg.t === 'trunk') {
      const dx = x - tg.cx;
      const d = Math.sqrt(Math.max(0.2, tg.r * tg.r - dx * dx));
      addCol(x, y, -d, d, 0.5, c0, co0, () => [c0, WOOD]);
    } else if (tg.t === 'branch') {
      const b = branches[tg.id];
      const zc = (b.z1 || 0) * tg.f;
      curBranch = tg.id;
      addCol(x, y, zc - 0.45, zc + 0.45, 0.45, c0, co0, () => [c0, WOOD]);
    } else if (tg.t === 'root') {
      addCol(x, y, -0.8, 0.8, 0.8, c0, co0, () => [c0, WOOD_DARK]);
    } else if (tg.t === 'ground') {
      const R = Math.sqrt(Math.max(0, RG * RG - (x - CX) * (x - CX)));
      addCol(x, y, -R, R, 1, c0, co0, () => r2() < 0.16 ? [pick('_.,_', r2), GRASS] : [null]);
    } else {                                                  // single specks of grass / dirt
      const R = Math.sqrt(Math.max(0, RG * RG - (x - CX) * (x - CX)));
      const z = (r2() * 2 - 1) * R * 0.8;
      addCol(x, y, z, z, 1, c0, co0, () => [null]);
    }
  }

  const NP = PXa.length;
  const PX = Float32Array.from(PXa), PR = Float32Array.from(PRa), PZ = Float32Array.from(PZa);
  const CO = Int16Array.from(COa), BR = Int16Array.from(BRa), CL = Int32Array.from(CLa);
  const CH = CHa;
  const hidden = new Uint8Array(nCols);

  // ════════════════════════════════════════════════════════════════
  //  3. View, rendering
  // ════════════════════════════════════════════════════════════════
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = 'ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, "Courier New", monospace';
  const BG = '#191919';
  const PIV = 16;                   // tilt around this row
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  let yaw = 0, pitch = 0, vel = 0, target = 0;
  let Wpx, Hpx, fs, cw, chh, R, C0, R0, SC, SR, gx0, gy0;
  let depth, owner, stamp, touched, frameId = 0;

  const resize = () => {
    const DPR = Math.min(devicePixelRatio || 1, 2);
    Wpx = innerWidth; Hpx = innerHeight;
    canvas.width = Math.round(Wpx * DPR); canvas.height = Math.round(Hpx * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.font = `100px ${FONT}`;
    const ratio = ctx.measureText('M').width / 100;
    fs = Math.min(16, (Wpx - 32) / W / ratio, (Hpx - 48) / H / 1.15);
    cw = fs * ratio; chh = fs * 1.15; R = chh / cw;   // R: one row in character widths
    const gl = (Wpx - W * cw) / 2, gt = (Hpx - H * chh) / 2;
    C0 = Math.ceil(gl / cw) + 1; R0 = Math.ceil(gt / chh) + 1;
    gx0 = gl - C0 * cw; gy0 = gt - R0 * chh;
    SC = W + 2 * C0 + 2; SR = H + 2 * R0 + 2;
    depth = new Float32Array(SC * SR); owner = new Int32Array(SC * SR);
    stamp = new Int32Array(SC * SR); touched = new Int32Array(SC * SR);
    ctx.font = `${fs}px ${FONT}`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
  };

  let cy, sy, cp, sp;
  // world → [screen column, screen row, depth] (columns/rows are fractional)
  const proj = (X, row, Z, out) => {
    const X1 = X * cy + Z * sy, Z1 = -X * sy + Z * cy;
    const Yd = (row - PIV) * R;
    out[0] = CX + X1;
    out[1] = PIV + (Yd * cp - Z1 * sp) / R;
    out[2] = Z1 * cp + Yd * sp;
    return out;
  };
  const pt = [0, 0, 0];

  // falling leaves
  const falling = [];
  const dropLeaf = () => {
    for (let tries = 0; tries < 30; tries++) {
      const L = leafCols[(rnd() * leafCols.length) | 0];
      if (hidden[L.cid]) continue;
      if (!L.yellow && rnd() < 0.55) continue;
      const i = colFront[L.cid];
      hidden[L.cid] = 1;
      setTimeout(() => { hidden[L.cid] = 0; }, 7000 + rnd() * 14000);
      falling.push({
        bx: PX[i], x: PX[i], row: PR[i], z: PZ[i] - 0.6, bz: PZ[i] - 0.6, t: 0,
        vy: 1.6 + rnd() * 1.6, amp: 0.6 + rnd() * 1.4, freq: 1 + rnd() * 1.6,
        zamp: 0.5 + rnd() * 1.5, p: rnd() * 6.283,
        rot: rnd() * 6.283, vr: (rnd() - 0.5) * 4.5,
        ch: CH[i], co: PAL[CO[i]][REST_LV], rest: -1, op: 1,
      });
      return;
    }
  };

  const draw = () => {
    cy = Math.cos(yaw); sy = Math.sin(yaw); cp = Math.cos(pitch); sp = Math.sin(pitch);
    // 0 at the front view → exact 2D colours and characters; grows as the tree turns
    const turn = clamp(Math.abs(sy) * 3 + (1 - cy) * 1.5 + pitch * 4, 0, 1);

    // branch characters follow their on-screen direction while turning
    const brCh = branches.map(b => {
      const dx = b.x1 - b.x0, dz = b.z1 || 0, dyR = (b.y1 - b.y0) * R;
      const sx = dx * cy + dz * sy, zr = -dx * sy + dz * cy;
      const sdy = dyR * cp - zr * sp;                          // + is down
      if (Math.hypot(sx, sdy) < 1.2) return 'o';
      const deg = Math.atan2(Math.abs(sdy), Math.abs(sx)) * 57.3;
      return deg > 70 ? '|' : deg < 24 ? '_' : (sx * sdy < 0 ? '/' : '\\');
    });

    frameId++;
    let nT = 0;
    for (let i = 0; i < NP; i++) {
      if (hidden[CL[i]]) continue;
      const X = PX[i], Z = PZ[i];
      const X1 = X * cy + Z * sy, Z1 = -X * sy + Z * cy;
      const Yd = (PR[i] - PIV) * R;
      const c = Math.round(CX + X1) + C0;
      const r = Math.round(PIV + (Yd * cp - Z1 * sp) / R) + R0;
      if (c < 0 || c >= SC || r < 0 || r >= SR) continue;
      const dz = Z1 * cp + Yd * sp;
      const idx = r * SC + c;
      if (stamp[idx] !== frameId) { stamp[idx] = frameId; depth[idx] = dz; owner[idx] = i; touched[nT++] = idx; }
      else if (dz < depth[idx]) { depth[idx] = dz; owner[idx] = i; }
    }

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, Wpx, Hpx);
    let last = '';
    for (let k = 0; k < nT; k++) {
      const idx = touched[k], i = owner[idx];
      let lv = REST_LV;
      if (turn > 0) {
        const f = 1 - turn * 0.45 * clamp(depth[idx] / 20, -1, 1);   // near = brighter, far = dimmer
        lv = clamp(Math.round(REST_LV + (f - 1) / 0.1), 0, FACT.length - 1);
      }
      const style = PAL[CO[i]][lv];
      if (style !== last) { ctx.fillStyle = style; last = style; }
      const chr = BR[i] >= 0 && turn > 0.15 ? brCh[BR[i]] : CH[i];
      ctx.fillText(chr, gx0 + ((idx % SC) + 0.5) * cw, gy0 + ((idx / SC | 0) + 0.5) * chh);
    }

    for (const L of falling) {
      proj(L.x, L.row, L.z, pt);
      if (turn > 0.15) {
        const c = Math.round(pt[0]) + C0, r = Math.round(pt[1]) + R0;
        if (c >= 0 && c < SC && r >= 0 && r < SR) {
          const idx = r * SC + c;
          if (stamp[idx] === frameId && depth[idx] < pt[2] - 1) continue;
        }
      }
      ctx.save();
      ctx.globalAlpha = L.op;
      ctx.fillStyle = L.co;
      ctx.translate(gx0 + (pt[0] + C0 + 0.5) * cw, gy0 + (pt[1] + R0 + 0.5) * chh);
      ctx.rotate(L.rot);
      ctx.fillText(L.ch, 0, 0);
      ctx.restore();
    }
  };

  // ════════════════════════════════════════════════════════════════
  //  4. Drag to turn; on release it settles back to the front view
  // ════════════════════════════════════════════════════════════════
  const TAU = Math.PI * 2;
  let dragging = false, lastX = 0, lastY = 0, lastT = 0, moved = 0, dragVel = 0;
  canvas.addEventListener('pointerdown', e => {
    dragging = true; moved = 0; dragVel = 0; vel = 0;
    lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    const now = performance.now(), dx = e.clientX - lastX, dy = e.clientY - lastY;
    const k = 3.2 / Math.max(320, Math.min(Wpx, Hpx));
    yaw -= dx * k;
    pitch = clamp(pitch + dy * k * 0.5, 0, 0.35);
    const dt = Math.max(1, now - lastT) / 1000;
    dragVel = dragVel * 0.6 + (-dx * k / dt) * 0.4;
    moved += Math.abs(dx) + Math.abs(dy);
    lastX = e.clientX; lastY = e.clientY; lastT = now;
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove('dragging');
    if (moved < 6) { for (let i = 0; i < 14; i++) dropLeaf(); return; }
    vel = performance.now() - lastT > 80 ? 0 : clamp(dragVel, -8, 8);
    target = Math.round((yaw + vel * 0.35) / TAU) * TAU;     // nearest front view in the flick's direction
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ════════════════════════════════════════════════════════════════
  //  5. Loop
  // ════════════════════════════════════════════════════════════════
  let lastNow = performance.now(), spawnAcc = 0, nextSpawn = 0.5, windT = 0;
  const K = 16, C = 8;                                       // critically damped spring
  const frame = now => {
    const dt = Math.min((now - lastNow) / 1000, 0.05);
    lastNow = now;

    if (!dragging) {
      vel += (K * (target - yaw) - C * vel) * dt;
      yaw += vel * dt;
      pitch += (0 - pitch) * (1 - Math.exp(-dt * 6));
      if (Math.abs(target - yaw) < 1e-3 && Math.abs(vel) < 1e-2) { yaw = target = 0; vel = 0; }
      if (pitch < 1e-3) pitch = 0;
    }

    windT += dt;
    const wind = Math.sin(windT * 0.23) * 0.5 + Math.sin(windT * 0.71) * 0.25;
    spawnAcc += dt;
    if (spawnAcc >= nextSpawn) { spawnAcc = 0; nextSpawn = 0.35 + rnd() * 1.1; dropLeaf(); }

    for (let i = falling.length - 1; i >= 0; i--) {
      const L = falling[i];
      L.t += dt;
      if (L.rest < 0) {
        L.row += L.vy * dt;
        L.bx += wind * dt;
        L.x = L.bx + Math.sin(L.p + L.t * L.freq) * L.amp;
        L.z = L.bz + Math.cos(L.p * 1.7 + L.t * L.freq * 0.8) * L.zamp;
        L.rot += L.vr * dt;
        if (L.row >= GROUND - 0.15 && L.x * L.x + L.z * L.z < RG * RG) {
          L.row = GROUND - 0.15; L.rot = Math.round(L.rot / Math.PI) * Math.PI; L.rest = 2.5 + rnd() * 4;
        } else if (L.row > H + 2) L.op -= dt;
      } else {
        L.rest -= dt;
        if (L.rest <= 0) L.op -= dt * 0.5;
      }
      if (L.op <= 0) falling.splice(i, 1);
    }

    draw();
    requestAnimationFrame(frame);
  };

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
